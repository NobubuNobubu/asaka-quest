<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASAKA QUEST 管理画面</title>
    <meta name="description" content="ASAKA QUESTの管理画面です。" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">管理画面</p>
          <h1>ASAKA QUEST 管理パネル</h1>
        </div>
        <a class="back-link" href="index.html">ホームへ戻る</a>
      </header>

      <main class="dashboard">
        <section class="panel panel--form" aria-labelledby="formTitle">
          <div class="panel-header-row">
            <div>
              <h2 id="formTitle">問題を追加</h2>
              <p class="panel-note">必要な項目を入力して、保存ボタンを押してください。編集中は下部に状態が表示されます。</p>
            </div>
            <div class="status-tag" id="editStatus" hidden>新規追加モード</div>
          </div>
          <div class="action-message" id="actionMessage" hidden>編集結果が反映されました。</div>

          <form id="questionForm" class="question-form">
            <label>
              問題文
              <textarea id="questionText" rows="3" required placeholder="例: 校庭の広さは何mですか？"></textarea>
            </label>

            <label>
              選択肢1
              <input id="option1" type="text" required placeholder="例: 30m" />
            </label>

            <label>
              選択肢2
              <input id="option2" type="text" required placeholder="例: 40m" />
            </label>

            <label>
              選択肢3
              <input id="option3" type="text" required placeholder="例: 50m" />
            </label>

            <label>
              選択肢4
              <input id="option4" type="text" required placeholder="例: 60m" />
            </label>

            <label class="grid-two-column">
              <span>正解番号</span>
              <input id="answerIndex" type="number" min="1" max="4" value="1" required />
            </label>

            <label>
              解説
              <textarea id="explanation" rows="2" placeholder="正解の理由やポイントを書きます。"></textarea>
            </label>

            <label>
              画像URL
              <input id="imageUrl" type="url" placeholder="https://example.com/image.png" />
            </label>

            <label class="checkbox-row">
              <input id="isPublic" type="checkbox" checked />
              公開する
            </label>

            <div class="form-actions">
              <button type="submit">問題を保存</button>
              <button type="button" id="clearFormButton" class="button-secondary">入力をリセット</button>
              <button type="button" id="cancelEditButton" class="button-tertiary">編集中をキャンセル</button>
            </div>
          </form>
        </section>

        <section class="panel" aria-labelledby="listTitle">
          <div class="panel__head">
            <div>
              <h2 id="listTitle">問題一覧</h2>
              <p>編集、削除、公開状態の切り替えに加えて、ドラッグで順番を変更できます。</p>
            </div>
            <div class="panel-summary">
              <p>問題数: <span id="questionCount">0</span></p>
            </div>
          </div>

          <ul id="questionList" class="question-list"></ul>
        </section>
      </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
