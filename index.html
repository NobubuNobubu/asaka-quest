<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASAKA QUEST</title>
    <meta name="description" content="ASAKA QUESTは、学校説明会をゲームのように体験できるWebクイズです。" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero glass-card">
        <p class="hero__badge">🏫 ASAKA QUEST</p>
        <h1>楽しみながら学校を知ろう！</h1>
        <p class="hero__text">
          学校説明会を、ゲームのように体験できるWebクイズです。
        </p>
      </header>

      <main>
        <section class="menu-grid" aria-label="メニュー">
          <button class="menu-card glass-card" type="button" data-action="start">
            <span class="menu-card__icon">🎮</span>
            <span class="menu-card__label">クイズを始める</span>
          </button>

          <button class="menu-card glass-card" type="button" data-action="coming-soon">
            <span class="menu-card__icon">🏫</span>
            <span class="menu-card__label">学校紹介</span>
          </button>

          <button class="menu-card glass-card" type="button" data-action="coming-soon">
            <span class="menu-card__icon">🏆</span>
            <span class="menu-card__label">ランキング</span>
          </button>

          <button class="menu-card glass-card" type="button" data-action="login">
            <span class="menu-card__icon">🔐</span>
            <span class="menu-card__label">管理者ログイン</span>
          </button>
        </section>
      </main>
    </div>

    <footer class="footer">
      <p>© 2026 ASAKA QUEST</p>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
