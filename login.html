<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASAKA QUEST 管理者ログイン</title>
    <meta name="description" content="ASAKA QUESTの管理者ログイン画面です。" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/quiz.css" />
  </head>
  <body>
    <div class="page-shell">
      <main>
        <section class="glass-card quiz-card" aria-labelledby="loginTitle">
          <p class="quiz-badge">管理者ログイン</p>
          <h1 id="loginTitle">管理者用ログイン</h1>
          <p class="question-text">管理画面へ入るためのログイン画面です。</p>

          <form class="login-form" id="loginForm">
            <label class="login-field" for="adminId">メールアドレス</label>
            <input id="adminId" name="adminId" type="email" placeholder="admin@example.com" required />

            <label class="login-field" for="adminPassword">パスワード</label>
            <input id="adminPassword" name="adminPassword" type="password" placeholder="password" required />

            <button class="next-button" type="submit">ログイン</button>
          </form>

          <div class="login-error" id="loginErrorMessage" aria-live="polite"></div>
          <p class="login-status" id="loginStatus"></p>

          <p class="login-note">
            ※ Firebase の Email/Password 認証を有効にし、ユーザーを追加した上でログインしてください。Firebase が使えない場合は、ローカルの `admin / password` でも入れます。
          </p>
        </section>
      </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
